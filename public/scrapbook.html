document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

    <div style=\"position:absolute;top:96px;left:38px;right:30px;text-align:center;line-height:.92\">\n              <span style=\"display:inline-block;font-family:'Anton',sans-serif;font-size:62px;color:#fff;background:var(--accent);padding:2px 12px;transform:rotate(-5deg);box-shadow:2px 2px 0 rgba(0,0,0,.18);border-radius:3px;margin:2px\">A<\u002Fspan><span style=\"display:inline-block;font-family:'Abril Fatface',serif;font-size:60px;color:#3f8f86;background:#fff;padding:2px 9px;transform:rotate(4deg);box-shadow:2px 2px 0 rgba(0,0,0,.15);margin:2px\">R<\u002Fspan><span style=\"display:inline-block;font-family:'Archivo Black',sans-serif;font-size:54px;color:#4a6fae;background:#ffe9c2;padding:4px 10px;transform:rotate(-2deg);box-shadow:2px 2px 0 rgba(0,0,0,.15);margin:2px\">T<\u002Fspan>\n              <br>\n              <span style=\"display:inline-block;font-family:'Archivo Black',sans-serif;font-size:50px;color:#fff;background:#3f8f86;padding:3px 9px;transform:rotate(3deg);box-shadow:2px 2px 0 rgba(0,0,0,.15);margin:2px 1px\">S<\u002Fspan><span style=\"display:inline-block;font-family:'Anton',sans-serif;font-size:56px;color:#d6485a;background:#fff;padding:2px 8px;transform:rotate(-4deg);box-shadow:2px 2px 0 rgba(0,0,0,.15);margin:2px 1px\">C<\u002Fspan><span style=\"display:inline-block;font-family:'Abril Fatface',serif;font-size:54px;color:#fff;background:var(--accent2);padding:2px 9px;transform:rotate(2deg);box-shadow:2px 2px 0 rgba(0,0,0,.15);margin:2px 1px\">R<\u002Fspan><span style=\"display:inline-block;font-family:'Archivo Black',sans-serif;font-size:50px;color:#8c4a73;background:#fff;padding:3px 8px;transform:rotate(-3deg);box-shadow:2px 2px 0 rgba(0,0,0,.15);margin:2px 1px\">A<\u002Fspan><span style=\"display:inline-block;font-family:'Anton',sans-serif;font-size:56px;color:#fff;background:#4a6fae;padding:2px 9px;transform:rotate(5deg);box-shadow:2px 2px 0 rgba(0,0,0,.15);margin:2px 1px\">P<\u002Fspan><span style=\"display:inline-block;font-family:'Abril er2:'#f7e6df',ink:'#4b3a37',soft:'#8a716b',cover:'#f1bcc8',cover2:'#e89fb0',coverInk:'#8c3b4a',bind:'#e58fa0',accent:'#cf5666',accent2:'#d98f3d',grid:'rgba(150,90,90,.07)'},\n    eclectic:{paper:'#f4ecdd',paper2:'#e9dcc4',ink:'#33302a',soft:'#7a7160',cover:'#d8c7a4',cover2:'#c9b48a',coverInk:'#2e2a22',bind:'#9c8e72',accent:'#d6485a',accent2:'#3f8f86',grid:'rgba(80,70,50,.06)'},\n    vintage: {paper:'#efe6d2',paper2:'#e2d4b8',ink:'#3a2f28',soft:'#7a6553',cover:'#7c2f29',cover2:'#5e231f',coverInk:'#f0e3cf',bind:'#6a4a2a',accent:'#b5482f',accent2:'#c9a23f',grid:'rgba(80,50,30,.06)'}\n  };\n  THEME_KEY = {'Pink journal':'pink','Eclectic collage':'eclectic','Vintage cinema':'vintage'};\n  PW = 470;\n\n  componentDidMount(){\n    this.root = document.getElementById('scrapRoot');\n    if(!this.root) return;\n    this.stage = this.root.querySelector('#stageScale');\n    this.bookWrap = this.root.querySelector('#bookWrap');\n    this.spine = this.root.querySelector('#spine');\n    this.leaves = Array.from(this.root.querySelectorAll('[data-leaf]'));\n    this.current = 0;\n    this.animating = false;\n    this.drag = null;\n    this.soundOn = this.props.soundOn !== false;\n\n    this.onDown = this.onDown.bind(this);\n    this.onMove = this.onMove.bind(this);\n    this.onUp = this.onUp.bind(this);\n    this.onKey = this.onKey.bind(this);\n    this.fit = this.fit.bind(this);\n\n    this.root.addEventListener('pointerdown', this.onDown);\n    window.addEventListener('pointermove', this.onMove, {passive:false});\n    window.addEventListener('pointerup', this.onUp);\n    window.addEventListener('keydown', this.onKey);\n    window.addEventListener('resize', this.fit);\n\n    this.root.querySelector('[data-act=\"prev\"]').addEventListener('click', ()=>this.animate(-1));\n    this.root.querySelector('[data-act=\"next\"]').addEventListener('click', ()=>this.animate(1));\n    this.root.querySelector('[data-act=\"sound\"]').addEventListener('click', (e)=>{\n      this.soundOn = !this.soundOn;\n      e.currentTarget.style.opacity = this.soundOn ? '1' : '.4';\n      if(this.soundOn){ this.resumeAudio(); this.playRustle(); }\n    });\n\n    this.applySettings();\n    this.fit();\n    this.layout();\n    this.setShift();\n    this.updateChrome();\n  }\n  componentDidUpdate(){ this.applySettings(); }\n  componentWillUnmount(){\n    window.removeEventListener('pointermove', this.onMove);\n    window.removeEventListener('pointerup', this.onUp);\n    window.removeEventListener('keydown', this.onKey);\n    window.removeEventListener('resize', this.fit);\n  }\n\n  applySettings(){\n    const t = this.THEMES[this.THEME_KEY[this.props.theme] || 'pink'];\n    for(const k in t) this.root.style.setProperty('--'+k, t[k]);\n    this.soundOn = this.props.soundOn !== false;\n    const sBtn = this.root.querySelector('[data-act=\"sound\"]');\n    if(sBtn) sBtn.style.opacity = this.soundOn ? '1' : '.4';\n    this.applyPattern();\n    this.buildBinding(this.props.binding === 'Saddle stitch' ? 'stitch' : 'coil');\n  }\n  applyPattern(){\n    const pat = this.props.coverPattern || 'Gingham';\n    let bg = 'none';\n    if(pat === 'Gingham') bg = 'repeating-linear-gradient(0deg,transparent 0 15px,rgba(255,255,255,.17) 15px 30px),repeating-linear-gradient(90deg,transparent 0 15px,rgba(255,255,255,.17) 15px 30px)';\n    else if(pat === 'Dots') bg = 'radial-gradient(circle at 12px 12px, rgba(255,255,255,.4) 3px, transparent 4px)';\n    this.root.querySelectorAll('[data-coverpat],[data-coverpat-b]').forEach(el=>{\n      el.style.background = bg;\n      el.style.backgroundSize = pat === 'Dots' ? '34px 34px' : 'auto';\n      el.style.opacity = pat === 'Plain' ? '0' : '.85';\n    });\n  }\n  buildBinding(kind){\n    if(!this.spine) return;\n    this.spine.innerHTML='';\n    const n = Math.floor(630/26);\n    for(let i=0;i<n;i++){\n      const loop=document.createElement('div');\n      if(kind==='stitch'){\n        loop.style.cssText='height:26px;display:flex;align-items:center;justify-content:center';\n        loop.innerHTML='<div style=\"width:22px;height:3px;border-radius:2px;background:var(--coverInk);opacity:.45;transform:rotate('+(i%2?22:-22)+'deg)\"><\u002Fdiv>';\n      } else {\n        loop.style.cssText='height:26px;position:relative';\n        loop.innerHTML='<div style=\"position:absolute;inset:3px 3px;border-radius:9px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(0,0,0,.28)),var(--bind);box-shadow:0 1px 2px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.6);transform:rotate(-16deg)\"><\u002Fdiv><div style=\"position:absolute;left:7px;top:9px;width:5px;height:8px;border-radius:50%;background:rgba(0,0,0,.42)\"><\u002Fdiv><div style=\"position:absolute;right:7px;top:9px;width:5px;height:8px;border-radius:50%;background:rgba(0,0,0,.42)\"><\u002Fdiv>';\n      }\n      this.spine.appendChild(loop);\n    }\n  }\n\n  fit(){\n    const W=1180,H=860;\n    const s=Math.min(window.innerWidth/W, window.innerHeight/H, 1.18);\n    this.scale=s;\n    this.stage.style.transform=`translate(-50%,-50%) scale(${s})`;\n  }\n\n  faces(leaf){ return [leaf.querySelector('[data-face=\"front\"]'), leaf.querySelector('[data-face=\"back\"]')]; }\n  layout(){\n    const L=this.leaves.length;\n    this.leaves.forEach((leaf,i)=>{\n      const flipped = i < this.current;\n      leaf.style.transition='none';\n      leaf.style.transform = flipped ? 'rotateY(-180deg)' : 'rotateY(0deg)';\n      leaf.style.zIndex = flipped ? (i+1) : (L-i);\n      const [f,b]=this.faces(leaf);\n      f.style.visibility = flipped ? 'hidden' : 'visible';\n      b.style.visibility = flipped ? 'visible' : 'hidden';\n      leaf.querySelectorAll('[data-shade]').forEach(s=>{ s.style.opacity=0; s.style.animation='none'; });\n    });\n  }\n  setShift(c=this.current){\n    const L=this.leaves.length;\n    const shift = c<=0 ? -this.PW/2 : c>=L ? this.PW/2 : 0;\n    this.bookWrap.style.setProperty('--shift', shift+'px');\n  }\n  updateChrome(){\n    const L=this.leaves.length;\n    const ind=this.root.querySelector('[data-indicator]');\n    if(this.current===0) ind.textContent='front cover';\n    else if(this.current>=L) ind.textContent='back cover';\n    else ind.textContent='spread '+this.current+' / '+(L-1);\n    const pv=this.root.querySelector('[data-act=\"prev\"]'), nx=this.root.querySelector('[data-act=\"next\"]');\n    pv.style.opacity=this.current<=0?'.35':'1'; pv.style.pointerEvents=this.current<=0?'none':'auto';\n    nx.style.opacity=this.current>=L?'.35':'1'; nx.style.pointerEvents=this.current>=L?'none':'auto';\n  }\n\n  flash(leaf){\n    leaf.querySelectorAll('[data-shade]').forEach(s=>{ s.style.animation='none'; void s.offsetWidth; s.style.animation='flipShade .72s ease'; });\n  }\n\n  animate(dir){\n    if(this.animating) return;\n    const L=this.leaves.length, DUR=720;\n    let leaf, target;\n    if(dir===1 && this.current<L){ leaf=this.leaves[this.current]; target=-180; }\n    else if(dir===-1 && this.current>0){ leaf=this.leaves[this.current-1]; target=0; }\n    else return;\n    this.animating=true; this.resumeAudio(); this.playRustle();\n    leaf.style.zIndex=L+5; this.flash(leaf);\n    const [f,b]=this.faces(leaf);\n    if(dir===1){ f.style.visibility='visible'; b.style.visibility='hidden'; }\n    else { b.style.visibility='visible'; f.style.visibility='hidden'; }\n    leaf.style.transition='transform '+DUR+'ms cubic-bezier(.5,.02,.3,1)';\n    this.setShift(this.current + dir);\n    requestAnimationFrame(()=>{ leaf.style.transform='rotateY('+target+'deg)'; });\n    setTimeout(()=>{ if(dir===1){ f.style.visibility='hidden'; b.style.visibility='visible'; } else { b.style.visibility='hidden'; f.style.visibility='visible'; } }, DUR*0.5);\n    let finished=false;\n    const done=()=>{ if(finished) return; finished=true; leaf.removeEventListener('transitionend',done); this.current+=dir; this.animating=false; this.layout(); this.updateChrome(); };\n    leaf.addEventListener('transitionend',done);\n    setTimeout(done, DUR+90);\n  }\n\n  onKey(e){\n    if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); this.animate(1); }\n    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); this.animate(-1); }\n  }\n\n  spineX(){ return this.bookWrap.getBoundingClientRect().left; }\n\n  onDown(e){\n    if(this.animating) return;\n    if(e.target.closest && e.target.closest('image-slot')) return;\n    if(e.target.closest && e.target.closest('button')) return;\n    const L=this.leaves.length, x=e.clientX, spine=this.spineX(), PWs=this.PW*this.scale;\n    let dir=0, leaf=null;\n    if(this.current<L && x>spine && x > spine + 0.5*PWs){ dir=1; leaf=this.leaves[this.current]; }\n    else if(this.current>0 && x<spine && x < spine - 0.5*PWs){ dir=-1; leaf=this.leaves[this.current-1]; }\n    if(!leaf) return;\n    e.preventDefault();\n    this.resumeAudio();\n    leaf.style.transition='none'; leaf.style.zIndex=L+5;\n    this.flash_off(leaf);\n    this.drag={leaf,dir,startX:x,spine,PWs,p:0};\n  }\n  flash_off(leaf){ leaf.querySelectorAll('[data-shade]').forEach(s=>s.style.animation='none'); }\n\n  onMove(e){\n    if(!this.drag) return;\n    e.preventDefault();\n    const d=this.drag, x=e.clientX;\n    let p, angle;\n    if(d.dir===1){ p=(d.spine + d.PWs - x)/(2*d.PWs); p=Math.max(0,Math.min(1,p)); angle=-180*p; }\n    else { p=(x - (d.spine - d.PWs))/(2*d.PWs); p=Math.max(0,Math.min(1,p)); angle=-180*(1-p); }\n    d.p=p;\n    d.leaf.style.transform='rotateY('+angle+'deg)';\n    const a=Math.abs(angle);\n    const [f,b]=this.faces(d.leaf);\n    if(a<90){ f.style.visibility='visible'; b.style.visibility='hidden'; }\n    else { f.style.visibility='hidden'; b.style.visibility='visible'; }\n    const sh = a<=90 ? (a/90)*0.6 : ((180-a)/90)*0.6;\n    d.leaf.querySelectorAll('[data-shade]').forEach(s=>s.style.opacity=sh);\n  }\n\n  onUp(e){\n    if(!this.drag) return;\n    const d=this.drag; this.drag=null;\n    const moved=Math.abs(e.clientX-d.startX);\n    d.leaf.querySelectorAll('[data-shade]').forEach(s=>s.style.opacity=0);\n    if(moved<6){ d.leaf.style.transition='none'; this.animate(d.dir); return; }\n    const complete=d.p>0.5;\n    d.leaf.style.transition='transform .4s ease-out';\n    if(d.dir===1){\n      if(complete){ d.leaf.style.transform='rotateY(-180deg)'; this.current++; this.playRustle(); }\n      else { d.leaf.style.transform='rotateY(0deg)'; }\n    } else {\n      if(complete){ d.leaf.style.transform='rotateY(0deg)'; this.current--; this.playRustle(); }\n      else { d.leaf.style.transform='rotateY(-180deg)'; }\n    }\n    this.setShift();\n    setTimeout(()=>{ this.layout(); this.updateChrome(); }, 420);\n  }\n\n  resumeAudio(){\n    if(!this.audio){ try{ this.audio = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.audio=null; } }\n    if(this.audio && this.audio.state==='suspended') this.audio.resume();\n  }\n  playRustle(){\n    if(!this.soundOn || !this.audio) return;\n    const ctx=this.audio, dur=0.22, sr=ctx.sampleRate;\n    const buf=ctx.createBuffer(1, Math.floor(sr*dur), sr), data=buf.getChannelData(0);\n    for(let i=0;i<data.length;i++){ const t=i/data.length; data[i]=(Math.random()*2-1)*Math.pow(1-t,1.5); }\n    const src=ctx.createBufferSource(); src.buffer=buf;\n    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2200+Math.random()*900; bp.Q.value=0.8;\n    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=1100;\n    const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.14,ctx.currentTime+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);\n    src.connect(bp); bp.connect(hp); hp.connect(g); g.connect(ctx.destination);\n    src.start();\n  }\n\n  renderVals(){ return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"

<script>
(function(){
  function hydrate(){
    var slots=document.querySelectorAll('image-slot[src]');
    slots.forEach(function(el){
      if(el.dataset.hydrated) return;
      var src=el.getAttribute('src'); if(!src) return;
      el.style.backgroundImage='url("'+src+'")';
      el.style.backgroundSize='cover';
      el.style.backgroundPosition='center';
      el.style.backgroundRepeat='no-repeat';
      el.dataset.hydrated='1';
    });
  }
  var n=0, iv=setInterval(function(){ hydrate(); if(++n>50) clearInterval(iv); },200);
  document.addEventListener('DOMContentLoaded',hydrate);
  window.addEventListener('load',hydrate);
  new MutationObserver(hydrate).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>
