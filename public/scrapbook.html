document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

     <!-- BACK = BACK COVER -->\n          <div data-face=\"back\" style=\"position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;border-radius:13px 4px 4px 13px;transform:rotateY(180deg);background:linear-gradient(135deg,var(--cover2),var(--cover));box-shadow:inset -14px 0 36px -18px rgba(0,0,0,.5),inset 0 0 70px rgba(0,0,0,.13)\">\n            <div data-coverpat-b=\"\" style=\"position:absolute;inset:0;pointer-events:none;opacity:.85;background:repeating-linear-gradient(0deg,transparent 0 15px,rgba(255,255,255,.17) 15px 30px),repeating-linear-gradient(90deg,transparent 0 15px,rgba(255,255,255,.17) 15px 30px)\"><\u002Fdiv>\n            <div style=\"position:absolute;left:0;right:0;top:130px;text-align:center\">\n              <span style=\"display:inline-block;font-family:'Abril Fatface',serif;font-size:34px;color:#fff;background:var(--accent);padding:2px 10px;transform:rotate(-3deg);box-shadow:2px 2px 0 rgba(0,0,0,.16);margin:2px\">the<\u002Fspan>\n              <span style=\"display:inline-block;font-family:'Anton',sans-serif;font-size:36px;color:var(--coverInk);background:#fff;padding:2px 10px;transform:rotate(3deg);box-shadow:2px 2px 0 rgba(0,0,0,.14);margin:2px\">end<\u002Fspan>\n              <div style=\"font-family:'Caveat',cursive;font-size:26px;color:var(--coverInk);margin-top:12px\">( for now )<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute;left:50%;bottom:150px;transform:translateX(-50%);display:flex;gap:4px;align-items:flex-end\">\n              <div style=\"width:3px;height:34px;background:var(--coverInk)\"><\u002Fdiv><div style=\"width:6px;height:34px;background:var(--coverInk)\"><\u002Fdiv><div style=\"width:2px;height:34px;background:var(--coverInk)\"><\u002Fdiv><div style=\"width:5px;height:34px;background:var(--coverInk)\"><\u002Fdiv><div style=\"width:2px;height:34px;background:var(--coverInk)\"><\u002Fdiv><div style=\"width:7px;height:34px;background:var(--coverInk)\"><\u002Fdiv><div style=\"width:3px;height:34px;background:var(--coverInk)\"><\u002Fdiv><div style=\"width:2px;height:34px;background:var(--coverInk)\"><\u002Fdiv><div style=\"width:6px;height:34px;background:var(--coverInk)\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute;left:0;right:0;bottom:110px;text-align:center;font-family:'Special Elite',monospace;font-size:11px;letter-spacing:3px;color:var(--coverInk);opacity:.8\">EST. 2024 · HANDMADE<\u002Fdiv>\n            <div data-shade=\"\" style=\"position:absolute;inset:0;pointer-events:none;background:linear-gradient(265deg,rgba(35,18,16,.45),rgba(35,18,16,0) 44%);opacity:0;will-change:opacity\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- spiral binding (built by JS) -->\n        <div id=\"spine\" style=\"position:absolute;left:0;top:0;width:30px;height:630px;transform:translateX(-15px) translateZ(3px);z-index:9999;pointer-events:none\"><\u002Fdiv>\n\n      <\u002Fdiv><!-- /bookWrap -->\n    <\u002Fdiv><!-- /scene -->\n\n    <!-- CONTROLS -->\n    <div style=\"position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;z-index:50\">\n      <button data-act=\"prev\" style=\"font-family:'Special Elite',monospace;font-size:15px;color:#fff;background:var(--accent);border:none;border-radius:30px;padding:11px 22px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.18);transform:rotate(-1.5deg)\">‹ back<\u002Fbutton>\n      <div data-indicator=\"\" style=\"font-family:'Caveat',cursive;font-size:24px;color:#6b5550;min-width:130px;text-align:center\">front cover<\u002Fdiv>\n      <button data-act=\"next\" style=\"font-family:'Special Elite',monospace;font-size:15px;color:#fff;background:var(--accent);border:none;border-radius:30px;padding:11px 22px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.18);transform:rotate(1.5deg)\">next ›<\u002Fbutton>\n      <button data-act=\"sound\" title=\"sound\" style=\"font-family:'Special Elite',monospace;font-size:16px;color:var(--ink);background:#fffdf8;border:2px solid var(--accent);border-radius:50%;width:44px;height:44px;cursor:pointer;box-shadow:0 4px 9px rgba(0,0,0,.15)\">♪<\u002Fbutton>\n    <\u002Fdiv>\n    <div data-hint=\"\" style=\"position:absolute;left:50%;top:14px;transform:translateX(-50%) rotate(-1deg);font-family:'Gloria Hallelujah',cursive;font-size:14px;color:#8a716b;background:rgba(255,253,248,.7);padding:5px 14px;border-radius:20px;z-index:50\">drag a corner ↻ &nbsp;·&nbsp; tap the page edge &nbsp;·&nbsp; ← → keys<\u002Fdiv>\n\n  <\u002Fdiv><!-- /stageScale -->\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Pink journal&quot;,&quot;Eclectic collage&quot;,&quot;Vintage cinema&quot;],&quot;default&quot;:&quot;Pink journal&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;coverPattern&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Gingham&quot;,&quot;Dots&quot;,&quot;Plain&quot;],&quot;default&quot;:&quot;Gingham&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;binding&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Spiral coil&quot;,&quot;Saddle stitch&quot;],&quot;default&quot;:&quot;Spiral coil&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Look&quot;},&quot;soundOn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behavior&quot;}}\">\nclass Component extends DCLogic {\n  THEMES = {\n    pink:    {paper:'#fff6f0',paper2:'#f7e6df',ink:'#4b3a37',soft:'#8a716b',cover:'#f1bcc8',cover2:'#e89fb0',coverInk:'#8c3b4a',bind:'#e58fa0',accent:'#cf5666',accent2:'#d98f3d',grid:'rgba(150,90,90,.07)'},\n    eclectic:{paper:'#f4ecdd',paper2:'#e9dcc4',ink:'#33302a',soft:'#7a7160',cover:'#d8c7a4',cover2:'#c9b48a',coverInk:'#2e2a22',bind:'#9c8e72',accent:'#d6485a',accent2:'#3f8f86',grid:'rgba(80,70,50,.06)'},\n    vintage: {paper:'#efe6d2',paper2:'#e2d4b8',ink:'#3a2f28',soft:'#7a6553',cover:'#7c2f29',cover2:'#5e231f',coverInk:'#f0e3cf',bind:'#6a4a2a',accent:'#b5482f',accent2:'#c9a23f',grid:'rgba(80,50,30,.06)'}\n  };\n  THEME_KEY = {'Pink journal':'pink','Eclectic collage':'eclectic','Vintage cinema':'vintage'};\n  PW = 470;\n\n  componentDidMount(){\n    this.root = document.getElementById('scrapRoot');\n    if(!this.root) return;\n    this.stage = this.root.querySelector('#stageScale');\n    this.bookWrap = this.root.querySelector('#bookWrap');\n    this.spine = this.root.querySelector('#spine');\n    this.leaves = Array.from(this.root.querySelectorAll('[data-leaf]'));\n    this.current = 0;\n    this.animating = false;\n    this.drag = null;\n    this.soundOn = this.props.soundOn !== false;\n\n    this.onDown = this.onDown.bind(this);\n    this.onMove = this.onMove.bind(this);\n    this.onUp = this.onUp.bind(this);\n    this.onKey = this.onKey.bind(this);\n    this.fit = this.fit.bind(this);\n\n    this.root.addEventListener('pointerdown', this.onDown);\n    window.addEventListener('pointermove', this.onMove, {passive:false});\n    window.addEventListener('pointerup', this.onUp);\n    window.addEventListener('keydown', this.onKey);\n    window.addEventListener('resize', this.fit);\n\n    this.root.querySelector('[data-act=\"prev\"]').addEventListener('click', ()=>this.animate(-1));\n    this.root.querySelector('[data-act=\"next\"]').addEventListener('click', ()=>this.animate(1));\n    this.root.querySelector('[data-act=\"sound\"]').addEventListener('click', (e)=>{\n      this.soundOn = !this.soundOn;\n      e.currentTarget.style.opacity = this.soundOn ? '1' : '.4';\n      if(this.soundOn){ this.resumeAudio(); this.playRustle(); }\n    });\n\n    this.applySettings();\n    this.fit();\n    this.layout();\n    this.setShift();\n    this.updateChrome();\n  }\n  componentDidUpdate(){ this.applySettings(); }\n  componentWillUnmount(){\n    window.removeEventListener('pointermove', this.onMove);\n    window.removeEventListener('pointerup', this.onUp);\n    window.removeEventListener('keydown', this.onKey);\n    window.removeEventListener('resize', this.fit);\n  }\n\n  applySettings(){\n    const t = this.THEMES[this.THEME_KEY[this.props.theme] || 'pink'];\n    for(const k in t) this.root.style.setProperty('--'+k, t[k]);\n    this.soundOn = this.props.soundOn !== false;\n    const sBtn = this.root.querySelector('[data-act=\"sound\"]');\n    if(sBtn) sBtn.style.opacity = this.soundOn ? '1' : '.4';\n    this.applyPattern();\n    this.buildBinding(this.props.binding === 'Saddle stitch' ? 'stitch' : 'coil');\n  }\n  applyPattern(){\n    const pat = this.props.coverPattern || 'Gingham';\n    let bg = 'none';\n    if(pat === 'Gingham') bg = 'repeating-linear-gradient(0deg,transparent 0 15px,rgba(255,255,255,.17) 15px 30px),repeating-linear-gradient(90deg,transparent 0 15px,rgba(255,255,255,.17) 15px 30px)';\n    else if(pat === 'Dots') bg = 'radial-gradient(circle at 12px 12px, rgba(255,255,255,.4) 3px, transparent 4px)';\n    this.root.querySelectorAll('[data-coverpat],[data-coverpat-b]').forEach(el=>{\n      el.style.background = bg;\n      el.style.backgroundSize = pat === 'Dots' ? '34px 34px' : 'auto';\n      el.style.opacity = pat === 'Plain' ? '0' : '.85';\n    });\n  }\n  buildBinding(kind){\n    if(!this.spine) return;\n    this.spine.innerHTML='';\n    const n = Math.floor(630/26);\n    for(let i=0;i<n;i++){\n      const loop=document.createElement('div');\n      if(kind==='stitch'){\n        loop.style.cssText='height:26px;display:flex;align-items:center;justify-content:center';\n        loop.innerHTML='<div style=\"width:22px;height:3px;border-radius:2px;background:var(--coverInk);opacity:.45;transform:rotate('+(i%2?22:-22)+'deg)\"><\u002Fdiv>';\n      } else {\n        loop.style.cssText='height:26px;position:relative';\n        loop.innerHTML='<div style=\"position:absolute;inset:3px 3px;border-radius:9px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(0,0,0,.28)),var(--bind);box-shadow:0 1px 2px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.6);transform:rotate(-16deg)\"><\u002Fdiv><div style=\"position:absolute;left:7px;top:9px;width:5px;height:8px;border-radius:50%;background:rgba(0,0,0,.42)\"><\u002Fdiv><div style=\"position:absolute;right:7px;top:9px;width:5px;height:8px;border-radius:50%;background:rgba(0,0,0,.42)\"><\u002Fdiv>';\n      }\n      this.spine.appendChild(loop);\n    }\n  }\n\n  fit(){\n    const W=1180,H=860;\n    const s=Math.min(window.innerWidth/W, window.innerHeight/H, 1.18);\n    this.scale=s;\n    this.stage.style.transform=`translate(-50%,-50%) scale(${s})`;\n  }\n\n  faces(leaf){ return [leaf.querySelector('[data-face=\"front\"]'), leaf.querySelector('[data-face=\"back\"]')]; }\n  layout(){\n    const L=this.leaves.length;\n    this.leaves.forEach((leaf,i)=>{\n      const flipped = i < this.current;\n      leaf.style.transition='none';\n      leaf.style.transform = flipped ? 'rotateY(-180deg)' : 'rotateY(0deg)';\n      leaf.style.zIndex = flipped ? (i+1) : (L-i);\n      const [f,b]=this.faces(leaf);\n      f.style.visibility = flipped ? 'hidden' : 'visible';\n      b.style.visibility = flipped ? 'visible' : 'hidden';\n      leaf.querySelectorAll('[data-shade]').forEach(s=>{ s.style.opacity=0; s.style.animation='none'; });\n    });\n  }\n  setShift(c=this.current){\n    const L=this.leaves.length;\n    const shift = c<=0 ? -this.PW/2 : c>=L ? this.PW/2 : 0;\n    this.bookWrap.style.setProperty('--shift', shift+'px');\n  }\n  updateChrome(){\n    const L=this.leaves.length;\n    const ind=this.root.querySelector('[data-indicator]');\n    if(this.current===0) ind.textContent='front cover';\n    else if(this.current>=L) ind.textContent='back cover';\n    else ind.textContent='spread '+this.current+' / '+(L-1);\n    const pv=this.root.querySelector('[data-act=\"prev\"]'), nx=this.root.querySelector('[data-act=\"next\"]');\n    pv.style.opacity=this.current<=0?'.35':'1'; pv.style.pointerEvents=this.current<=0?'none':'auto';\n    nx.style.opacity=this.current>=L?'.35':'1'; nx.style.pointerEvents=this.current>=L?'none':'auto';\n  }\n\n  flash(leaf){\n    leaf.querySelectorAll('[data-shade]').forEach(s=>{ s.style.animation='none'; void s.offsetWidth; s.style.animation='flipShade .72s ease'; });\n  }\n\n  animate(dir){\n    if(this.animating) return;\n    const L=this.leaves.length, DUR=720;\n    let leaf, target;\n    if(dir===1 && this.current<L){ leaf=this.leaves[this.current]; target=-180; }\n    else if(dir===-1 && this.current>0){ leaf=this.leaves[this.current-1]; target=0; }\n    else return;\n    this.animating=true; this.resumeAudio(); this.playRustle();\n    leaf.style.zIndex=L+5; this.flash(leaf);\n    const [f,b]=this.faces(leaf);\n    if(dir===1){ f.style.visibility='visible'; b.style.visibility='hidden'; }\n    else { b.style.visibility='visible'; f.style.visibility='hidden'; }\n    leaf.style.transition='transform '+DUR+'ms cubic-bezier(.5,.02,.3,1)';\n    this.setShift(this.current + dir);\n    requestAnimationFrame(()=>{ leaf.style.transform='rotateY('+target+'deg)'; });\n    setTimeout(()=>{ if(dir===1){ f.style.visibility='hidden'; b.style.visibility='visible'; } else { b.style.visibility='hidden'; f.style.visibility='visible'; } }, DUR*0.5);\n    let finished=false;\n    const done=()=>{ if(finished) return; finished=true; leaf.removeEventListener('transitionend',done); this.current+=dir; this.animating=false; this.layout(); this.updateChrome(); };\n    leaf.addEventListener('transitionend',done);\n    setTimeout(done, DUR+90);\n  }\n\n  onKey(e){\n    if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); this.animate(1); }\n    else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); this.animate(-1); }\n  }\n\n  spineX(){ return this.bookWrap.getBoundingClientRect().left; }\n\n  onDown(e){\n    if(this.animating) return;\n    if(e.target.closest && e.target.closest('image-slot')) return;\n    if(e.target.closest && e.target.closest('button')) return;\n    const L=this.leaves.length, x=e.clientX, spine=this.spineX(), PWs=this.PW*this.scale;\n    let dir=0, leaf=null;\n    if(this.current<L && x>spine && x > spine + 0.5*PWs){ dir=1; leaf=this.leaves[this.current]; }\n    else if(this.current>0 && x<spine && x < spine - 0.5*PWs){ dir=-1; leaf=this.leaves[this.current-1]; }\n    if(!leaf) return;\n    e.preventDefault();\n    this.resumeAudio();\n    leaf.style.transition='none'; leaf.style.zIndex=L+5;\n    this.flash_off(leaf);\n    this.drag={leaf,dir,startX:x,spine,PWs,p:0};\n  }\n  flash_off(leaf){ leaf.querySelectorAll('[data-shade]').forEach(s=>s.style.animation='none'); }\n\n  onMove(e){\n    if(!this.drag) return;\n    e.preventDefault();\n    const d=this.drag, x=e.clientX;\n    let p, angle;\n    if(d.dir===1){ p=(d.spine + d.PWs - x)/(2*d.PWs); p=Math.max(0,Math.min(1,p)); angle=-180*p; }\n    else { p=(x - (d.spine - d.PWs))/(2*d.PWs); p=Math.max(0,Math.min(1,p)); angle=-180*(1-p); }\n    d.p=p;\n    d.leaf.style.transform='rotateY('+angle+'deg)';\n    const a=Math.abs(angle);\n    const [f,b]=this.faces(d.leaf);\n    if(a<90){ f.style.visibility='visible'; b.style.visibility='hidden'; }\n    else { f.style.visibility='hidden'; b.style.visibility='visible'; }\n    const sh = a<=90 ? (a/90)*0.6 : ((180-a)/90)*0.6;\n    d.leaf.querySelectorAll('[data-shade]').forEach(s=>s.style.opacity=sh);\n  }\n\n  onUp(e){\n    if(!this.drag) return;\n    const d=this.drag; this.drag=null;\n    const moved=Math.abs(e.clientX-d.startX);\n    d.leaf.querySelectorAll('[data-shade]').forEach(s=>s.style.opacity=0);\n    if(moved<6){ d.leaf.style.transition='none'; this.animate(d.dir); return; }\n    const complete=d.p>0.5;\n    d.leaf.style.transition='transform .4s ease-out';\n    if(d.dir===1){\n      if(complete){ d.leaf.style.transform='rotateY(-180deg)'; th
